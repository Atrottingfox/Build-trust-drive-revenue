    <!-- JSON-LD: Organization + Person. Tells Google who you are. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Authority Engine",
        "alternateName": ["The Authority Engine", "Authority Engine by Sean Fox"],
        "url": "https://authorityengine.com.au",
        "logo": "https://authorityengine.com.au/apple-touch-icon.png",
        "description": "Content systems for 7 and 8 figure founders. Brand, content, and scale built into a media operating system.",
        "founder": {
          "@type": "Person",
          "name": "Sean Fox"
        }
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Sean Fox",
        "jobTitle": "Founder, Authority Engine",
        "url": "https://authorityengine.com.au",
        "image": "https://authorityengine.com.au/apple-touch-icon.png",
        "worksFor": {
          "@type": "Organization",
          "name": "Authority Engine"
        },
        "description": "Builds Authority Engines for 7 and 8 figure founders. Helps coaches, consultants and operators turn expertise into content systems that compound.",
        "knowsAbout": [
          "Content strategy",
          "Personal branding",
          "Media systems",
          "Authority building",
          "Content operations",
          "Founder marketing"
        ]
      }
    </script>
