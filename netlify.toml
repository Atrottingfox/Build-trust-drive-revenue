[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"
  edge_functions = "netlify/edge-functions"

# Pinned after the first build carrying @anthropic-ai/sdk failed with a bare
# "exit code 2" and no log. The same thing bit contentengine-v3: Netlify's
# default image resolves an older Node than the dependency tree needs, and the
# failure names nothing. Plain "22" resolved to a sub-22.12 build there, so the
# exact version is pinned rather than the major.
[build.environment]
  NODE_VERSION = "22.20.0"

# Hourly proof that an application can still reach GoHighLevel. Added after a
# submission produced a Slack alert and no contact at all, with nothing erroring.
# Alerts to Slack and tags healthcheck-failed in GHL.
[functions."health-check"]
  schedule = "@hourly"

# Once a day, prove an application still produces an email. Everything else
# guards one side; this guards the contract between the code and GoHighLevel,
# which is where it actually broke. Daily, not hourly: it sends a real email.
[functions."canary"]
  schedule = "0 20 * * *"

# Repairs rather than reports. Recreates the Calendly webhook if it goes
# missing, and re-fires the workflow for any applicant who received nothing.
# Runs after the health check has had its say.
[functions."self-heal"]
  schedule = "17 * * * *"

# The morning after a Brand Day, ask whether to invite them into the 90 days.
# 21:00 UTC is 07:00 Brisbane. One Slack message, one link, no app needed.
# Flags a paid client who has not booked their prep call, so it can be
# filtered and chased. Writes one new tag nothing else depends on. 08:00
# Brisbane, after the Brand Day nudge.
[functions."prep-call-chase"]
  schedule = "0 22 * * *"

[functions."brand-day-followup"]
  schedule = "0 21 * * *"

# Wednesday capacity. Six hours, each held eleven weeks, is a hard ceiling on how
# fast clients can be signed. Sustained intake above it does not build a queue,
# it builds a client who has paid and has nowhere to go. Monday 08:00 Brisbane,
# and it says nothing at all unless something needs saying.
[functions."capacity"]
  schedule = "0 22 * * 0"

# The board call outlives the install: it runs every month through the twelve,
# so the three created at booking would quietly run out around month three and
# the first anybody would know is a client asking when the next one is. Tops
# every active client back up, and clears the future ones for anybody who has
# left so their Friday hour can be offered again. Daily, and idempotent.
[functions."board-extend"]
  schedule = "0 23 * * *"

# Internal offer ladder. Gated at the edge so neither the route nor its
# JavaScript chunk is served without credentials.
[[edge_functions]]
  function = "ladder-auth"
  path = "/ladder"

# The health dashboard names environment variables and reports whether they are
# set, so it sits behind the same credentials as the ladder.
[[edge_functions]]
  function = "ladder-auth"
  path = "/health"

# Lists client names and can send a $15,000 invitation, so it is gated like the
# rest of the internal surface. The endpoint is gated too: a protected page in
# front of an open endpoint protects nothing.
[[edge_functions]]
  function = "ladder-auth"
  path = "/clients"

[[edge_functions]]
  function = "ladder-auth"
  path = "/.netlify/functions/clients"

# The data behind it, gated too. The page being protected is no use if the
# endpoint it calls will answer anybody.
[[edge_functions]]
  function = "ladder-auth"
  path = "/.netlify/functions/health-status"

[[edge_functions]]
  function = "ladder-auth"
  path = "/ladder-private/*"

# Capacity names live clients and says how full the book is, so it sits behind
# the same credentials as the rest of the internal surface. The slot picker
# itself is deliberately NOT gated: it goes to a client, and is gated instead on
# their contact carrying install-signed.
[[edge_functions]]
  function = "ladder-auth"
  path = "/capacity"

[[edge_functions]]
  function = "ladder-auth"
  path = "/.netlify/functions/capacity"

# A link a client receives should be readable. The contact id rides along as ?c=
[[redirects]]
  from = "/slot"
  to = "/.netlify/functions/install-slot"
  status = 200
  force = true

[[redirects]]
  from = "/capacity"
  to = "/.netlify/functions/capacity"
  status = 200
  force = true
